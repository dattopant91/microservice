server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins: "http://localhost:4200"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowedHeaders: "*"
            allowCredentials: true
      routes: 
        - id: auth-route
          uri: lb://employee-service
          predicates:
            - Path=/auth/**

        - id: employee-service
          uri: lb://employee-service 
          predicates:
            - Path=/api/employees/**
          filters:
            - AuthenticationFilter

        - id: user-controller-route
          uri: lb://employee-service
          predicates:
            - Path=/users/**
          filters:
            - AuthenticationFilter

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/