server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins: "http://localhost:4200" # अँगुलरचा पत्ता
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
            allowedHeaders: "*"
      routes:
        - id: employee-service
          uri: lb://employee-service 
          predicates:
            - Path=/api/employees/** 
            
            # next api-gateway.yml file
        # - id: employee-service
        #   uri: lb://employee-service 
        #   predicates:
        #     - Path=/api/employees/** 

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/